<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Interaktives 3D-Scatterplot</title>
  <!--<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>-->
  <script src="https://cdn.plot.ly/plotly-3.1.0.min.js"></script>
</head>
<body>
  <div id="plot" style="width:100%;height: 100vh;"></div> <!-- todo adjust height to avoid scrollbars -->
  
  <script>
    // 300 sample points 
    const n = 300;
    const x1 = Array.from({length: n}, () => Math.random() * 10);
    const x2 = Array.from({length: n}, () => Math.random() * 10);
    const x3 = Array.from({length: n}, () => Math.random() * 10);
    const y  = x1.map((a, i) => Math.sin(a/2) + Math.log(1 + x2[i]) - 0.5*x3[i]);

    const trace = {
      x: x1,
      y: x2,
      z: x3,
      mode: 'markers',
      marker: {
        size: 4,
        color: y,
        colorscale: 'Viridis',
        opacity: 0.8,
        colorbar: { title: 'y' }
      },
      type: 'scatter3d'
    };

    const layout = {
      title: 'Interaktives 3D-Scatterplot (Plotly.js)',
      scene: {
        xaxis: {title: 'x1'},
        yaxis: {title: 'x2'},
        zaxis: {title: 'x3'}
      }
    };

    Plotly.newPlot('plot', [trace], layout);
  </script>
</body>
</html>
