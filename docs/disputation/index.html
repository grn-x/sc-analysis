<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Full-Length-Presentation</title>
    <link rel="stylesheet" href="./imports/reveal.css">
    <link rel="stylesheet" href="./imports/theme/night.css">

            <!-- black, (black-contrast), blood, (dracula, league), night,
                                  <- dark <-> light ->
                        white, (white-contrast) serif, simple   -->

    <style>
        .reveal h1, .reveal h2, .reveal h3, .reveal h4, .reveal h5 {
            text-transform: none;
        }
    </style>        <!-- https://github.com/hakimel/reveal.js/issues/2226 -->

</head>
<body>

<div class="reveal">
    <div class="slides">

        <section data-markdown>
            <textarea data-template>
                ## Fast & Frictionless X
                #### Keine Zeit für Statik

                <br>
                <br>
                <br>

                Physik in Fast & Furious X (2023)
                <br>
                Ein kurzer Einblick in meine Arbeit


                Datum: Dezember 17, 2025
            </textarea>
        </section>

    </div>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
