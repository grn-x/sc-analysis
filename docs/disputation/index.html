                ## Luftwiderstand

                <div style="display: flex; gap: 2rem;">
                <div style="flex: 1;">

                Hohe Reynolds-Zahlen =>
                Quadratischer Luftwiderstand

                $F_L = \frac{1}{2} \cdot A \cdot \rho \cdot c_w \cdot v^2$


                $\ddot{x} = \frac{dv_x}{dt} = a_x$

                $m \cdot \frac{dv_x}{dt} = \underbrace{-\frac{1}{2} \cdot A \cdot \rho \cdot c_w \cdot v_x^2}_{F_L} $
                </div>


                <div style="flex: 1; display: flex; flex-direction: column; gap: 1rem;">
                  <div caption-replace-tag-img="resources/media/seq3-render-closed-back-lit.png" h="90%" cf="50%" ></div>
                  <div caption-replace-tag-img="resources/media/seq3-render-opened-front-high.png" h="90%" cf="50%"></div>
                </div>


                </div>

                Note:
                Gekoppelt; nur x
                Zweifache Ableitung nach Zeit
                Newton 2; Summe Kräfte = m*a

            </textarea>
        </section>
